services:
  api-gateway:
    build: ./apps/api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      PORT: 8080
      CV_SERVICE_URL: http://cv-service:3001
      JD_SERVICE_URL: http://jd-service:3002
      ANALYSIS_SERVICE_URL: http://analysis-service:3003
    depends_on:
      - cv-service
      - jd-service
      - analysis-service
    restart: unless-stopped

  cv-service:
    build: ./apps/cv-service
    ports:
      - "${CV_SERVICE_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${CV_DB_USER:-cv_user}:${CV_DB_PASSWORD:-cv_pass}@cv-db:5432/${CV_DB_NAME:-cv_db}
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      cv-db:
        condition: service_healthy
    volumes:
      - cv_uploads:/app/uploads
    restart: unless-stopped

  jd-service:
    build: ./apps/jd-service
    ports:
      - "${JD_SERVICE_PORT:-3002}:3002"
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${JD_DB_USER:-jd_user}:${JD_DB_PASSWORD:-jd_pass}@jd-db:5432/${JD_DB_NAME:-jd_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      jd-db:
        condition: service_healthy
    restart: unless-stopped

  analysis-service:
    build: ./apps/analysis-service
    ports:
      - "${ANALYSIS_SERVICE_PORT:-3003}:3003"
    environment:
      PORT: 3003
      DATABASE_URL: postgres://${ANALYSIS_DB_USER:-analysis_user}:${ANALYSIS_DB_PASSWORD:-analysis_pass}@analysis-db:5432/${ANALYSIS_DB_NAME:-analysis_db}
      CV_SERVICE_URL: http://cv-service:3001
      JD_SERVICE_URL: http://jd-service:3002
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-2500}
      HTTP_RETRIES: ${HTTP_RETRIES:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      analysis-db:
        condition: service_healthy
      cv-service:
        condition: service_started
      jd-service:
        condition: service_started
    restart: unless-stopped

  cv-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CV_DB_USER:-cv_user}
      POSTGRES_PASSWORD: ${CV_DB_PASSWORD:-cv_pass}
      POSTGRES_DB: ${CV_DB_NAME:-cv_db}
    volumes:
      - cv_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  jd-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${JD_DB_USER:-jd_user}
      POSTGRES_PASSWORD: ${JD_DB_PASSWORD:-jd_pass}
      POSTGRES_DB: ${JD_DB_NAME:-jd_db}
    volumes:
      - jd_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  analysis-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ANALYSIS_DB_USER:-analysis_user}
      POSTGRES_PASSWORD: ${ANALYSIS_DB_PASSWORD:-analysis_pass}
      POSTGRES_DB: ${ANALYSIS_DB_NAME:-analysis_db}
    volumes:
      - analysis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cv_data:
  cv_uploads:
  jd_data:
  analysis_data:
