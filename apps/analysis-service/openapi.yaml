
openapi: 3.0.3

info:
  title: Analysis Service
  description: >
    Service phân tích CV và Job Description, tính Match Score,
    xác định kỹ năng còn thiếu và đưa ra khuyến nghị.
    Phiên bản hiện tại sử dụng phương pháp so khớp kỹ năng và từ khóa,
    kết hợp Weighted Skill Matching và Circuit Breaker.
  version: 1.2.0

servers:
  - url: http://localhost:3003
    description: Analysis Service direct access

tags:
  - name: Health
  - name: Analysis

paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Database unavailable

  /analyses/circuit-status:
    get:
      tags: [Analysis]
      summary: Get Circuit Breaker status
      description: Returns the current state of each upstream Circuit Breaker.
      responses:
        '200':
          description: Circuit Breaker statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: analysis-service
                  circuitBreakers:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/CircuitBreakerStatus'
        '500':
          description: Internal server error

  /analyses:
    post:
      tags: [Analysis]
      summary: Analyze a CV against a Job Description
      description: >
        Creates an analysis, retrieves CV and JD data from their services,
        and calculates the matching result using weighted skill matching.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
            example:
              cvId: 1
              jdId: 1
      responses:
        '201':
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          description: Invalid analysis input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INVALID_ANALYSIS_INPUT
        '404':
          description: CV or JD not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Upstream service unavailable or circuit breaker open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Upstream service timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Analysis]
      summary: List all analyses
      responses:
        '200':
          description: List of analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Analysis'

  /analyses/{id}:
    get:
      tags: [Analysis]
      summary: Get an analysis by ID
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Analysis found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400':
          description: Invalid analysis ID
        '404':
          description: Analysis not found

  /analyses/{id}/skill-gaps:
    get:
      tags: [Analysis]
      summary: Get missing skills of an analysis
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Missing skills retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisId:
                    type: integer
                  missingSkills:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid analysis ID
        '404':
          description: Analysis not found
        '409':
          description: Analysis is not completed

  /analyses/{id}/recommendations:
    get:
      tags: [Analysis]
      summary: Get recommendations of an analysis
      parameters:
        - $ref: '#/components/parameters/AnalysisId'
      responses:
        '200':
          description: Recommendations retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysisId:
                    type: integer
                    example: 20
                  recommendations:
                    type: array
                    items:
                      type: string
        '400':
          description: Invalid analysis ID
        '404':
          description: Analysis not found
        '409':
          description: Analysis is not completed

components:
  parameters:
    AnalysisId:
      name: id
      in: path
      required: true
      description: Positive integer analysis ID
      schema:
        type: integer
        minimum: 1

  schemas:
    CircuitBreakerStatus:
      type: object
      properties:
        state:
          type: string
          enum: [CLOSED, OPEN, HALF_OPEN]
        failures:
          type: integer
          example: 0
        openedAt:
          type: integer
          nullable: true
          description: Timestamp in milliseconds when the circuit opened

    CreateAnalysisRequest:
      type: object
      required:
        - cvId
        - jdId
      properties:
        cvId:
          type: integer
          minimum: 1
          example: 1
        jdId:
          type: integer
          minimum: 1
          example: 1

    PriorityScore:
      type: object
      properties:
        matched:
          type: integer
        total:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100

    Analysis:
      type: object
      properties:
        id:
          type: integer
        cv_id:
          type: integer
        jd_id:
          type: integer
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
        result:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnalysisResult'
        error:
          nullable: true
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnalysisResult:
      type: object
      properties:
        strengths:
          type: array
          description: Skills in the CV that match the JD
          items:
            type: string
        weaknesses:
          type: array
          description: Missing skills and their priority
          items:
            type: object
            properties:
              skill:
                type: string
              priority:
                type: string
                enum: [REQUIRED, PREFERRED, NORMAL]
              explanation:
                type: string
        note:
          type: string
        matchScore:
          type: number
          minimum: 0
          maximum: 100
          example: 57
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        requiredSkills:
          type: array
          items:
            type: string
        preferredSkills:
          type: array
          items:
            type: string
        skillDetails:
          type: array
          items:
            type: object
            properties:
              skill:
                type: string
              status:
                type: string
                enum: [MATCHED, MISSING]
              priority:
                type: string
                enum: [REQUIRED, PREFERRED, NORMAL]
              weight:
                type: number
        scoreBreakdown:
          type: object
          properties:
            matchedWeight:
              type: number
            totalWeight:
              type: number
            formula:
              type: string
              example: matchedWeight / totalWeight * 100
            byPriority:
              type: object
              properties:
                required:
                  $ref: '#/components/schemas/PriorityScore'
                preferred:
                  $ref: '#/components/schemas/PriorityScore'
                normal:
                  $ref: '#/components/schemas/PriorityScore'
        recommendations:
          type: array
          items:
            type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        analysisId:
          type: integer
        status:
          type: string
