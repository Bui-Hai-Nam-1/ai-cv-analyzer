openapi: 3.0.3
info:
  title: Analysis Service
  version: 1.1.0
  description: Compare CV profiles with prioritized job requirements and generate recommendations.
servers:
  - url: http://localhost:3003
paths:
  /health:
    get:
      summary: Check service and database health
      responses:
        '200': { description: Service and database are healthy }
        '503': { description: Database is unavailable }
  /analyses:
    post:
      summary: Analyze a CV against a JD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cvId, jdId]
              properties:
                cvId: { type: integer, minimum: 1 }
                jdId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Analysis completed and stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisRecord' }
        '400': { description: Invalid input }
        '404': { description: Related CV or JD not found }
        '502': { description: AI recommendation provider failed }
        '503': { description: Upstream service unavailable }
        '504': { description: Upstream service timed out }
    get:
      summary: List analyses
      responses:
        '200': { description: Analysis list }
  /analyses/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get analysis
      responses:
        '200': { description: Analysis found }
        '400': { description: Invalid analysis identifier }
        '404': { description: Analysis not found }
  /analyses/{id}/skill-gaps:
    get:
      summary: Get missing skills and requirements
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Skill gaps }
        '400': { description: Invalid analysis identifier }
        '404': { description: Analysis not found }
        '409': { description: Analysis is not completed }
  /analyses/{id}/recommendations:
    get:
      summary: Get recommendations
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Recommendations }
        '400': { description: Invalid analysis identifier }
        '404': { description: Analysis not found }
        '409': { description: Analysis is not completed }
  /analyses/{id}/recommendations/more:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Generate and append additional learning recommendations
      description: AI suggestions are paired with search links for Vietnamese courses and YouTube tutorials. Rule-based suggestions are used when no AI key is configured.
      responses:
        '200':
          description: New recommendations appended to the saved analysis
        '400': { description: Invalid analysis identifier }
        '404': { description: Analysis not found }
        '409': { description: Analysis is incomplete or no unique suggestions remain }
        '502': { description: Configured AI provider failed }
        '503': { description: JD service is unavailable }
        '504': { description: JD service timed out }
components:
  schemas:
    AnalysisRecord:
      type: object
      properties:
        id: { type: integer }
        cv_id: { type: integer }
        jd_id: { type: integer }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        result:
          type: object
          properties:
            matchScore: { type: integer, minimum: 0, maximum: 100 }
            mustHaveScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
            matchedMustHaveCount: { type: integer }
            totalMustHaveCount: { type: integer }
            totalRequirements: { type: integer }
            matchedSkills: { type: array, items: { type: string } }
            missingSkills: { type: array, items: { type: string } }
            matchedRequirements: { type: array, items: { type: object } }
            missingRequirements: { type: array, items: { type: object } }
            recommendations:
              type: array
              items:
                oneOf:
                  - type: string
                  - $ref: '#/components/schemas/Recommendation'
            recommendationProvider: { type: string }
            breakdown: { type: object }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Recommendation:
      type: object
      required: [requirement, title, action, resources]
      properties:
        requirement: { type: string }
        category: { type: string }
        priority: { type: string, enum: [must_have, nice_to_have] }
        title: { type: string }
        action: { type: string }
        duration: { type: string, nullable: true }
        source: { type: string }
        resources:
          type: array
          items:
            type: object
            required: [label, type, url]
            properties:
              label: { type: string }
              type: { type: string, enum: [course_search, video_search] }
              language: { type: string }
              url: { type: string, format: uri }
