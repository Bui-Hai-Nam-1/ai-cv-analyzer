openapi: 3.0.3
info:
  title: JD Service
  version: 1.1.0
  description: Store job descriptions and extract categorized, prioritized requirements.
servers:
  - url: http://localhost:3002
paths:
  /health:
    get:
      summary: Check service and database health
      responses:
        '200': { description: Service and database are healthy }
        '503': { description: Database is unavailable }
  /jds:
    post:
      summary: Create a JD from text or an uploaded TXT/PDF/DOCX file
      description: AI extraction uses the configured OpenAI-compatible provider when OPENAI_API_KEY is set; otherwise heuristic extraction is reported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                company: { type: string }
                content: { type: string, minLength: 20 }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                title: { type: string }
                company: { type: string }
                file: { type: string, format: binary }
      responses:
        '201':
          description: JD stored and requirements extracted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDescription'
        '400': { description: Invalid request }
        '413': { description: File or extracted content exceeds size limits }
        '415': { description: Unsupported file type }
        '422': { description: Uploaded document cannot be parsed }
        '502': { description: Configured AI provider failed }
    get:
      summary: List job descriptions
      responses:
        '200':
          description: JD list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobDescription' }
  /jds/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get JD and its extracted requirements
      responses:
        '200':
          description: JD found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobDescription' }
        '400': { description: Invalid JD identifier }
        '404': { description: JD not found }
    delete:
      summary: Delete JD
      responses:
        '204': { description: JD deleted }
        '400': { description: Invalid JD identifier }
        '404': { description: JD not found }
components:
  schemas:
    JobDescription:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        company: { type: string, nullable: true }
        content: { type: string }
        file_name: { type: string, nullable: true }
        analysis_provider: { type: string }
        extracted_requirements:
          type: array
          items: { $ref: '#/components/schemas/Requirement' }
        created_at: { type: string, format: date-time }
    Requirement:
      type: object
      required: [name, category, priority, type]
      properties:
        name: { type: string }
        category:
          type: string
          enum: [technical_skills, soft_skills, experience, education, language, other]
        priority:
          type: string
          enum: [must_have, nice_to_have]
        type:
          type: string
          enum: [skill, requirement]
        description: { type: string, nullable: true }
